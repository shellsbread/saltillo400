<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shell's Bread</title>
  <meta name="description" content="Shell's Bread, pan de masa madre. Consulta nuestro menú, obtén tu tarjeta de fidelidad y haz tu pedido.">
  <meta name="theme-color" content="#1C1510">
  <link rel="icon" href="wallet/icono-192.png">
  <link rel="preload" as="image" href="fon-poster.webp">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      color: white;
      background: #1C1510;
      overflow-x: hidden;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Fondo en video */
    #background-video {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      z-index: -1;
      object-fit: cover;
    }

    .container {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      gap: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }

    /* Logo sin efecto neón */
    .logo {
      margin-top: clamp(80px, 15vh, 120px);
      width: min(280px, 75vw);
      transition: all 0.4s ease;
    }

    .logo:hover {
      transform: scale(1.05);
    }

    /* Barra superior */
    .top-bar {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 30px;
      z-index: 10;
    }

    .icon-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      border: 2px solid rgba(255, 255, 255, 0.4);
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
      border-color: white;
    }

    .icon-btn img {
      width: 40px;
      height: 40px;
    }

    /* Botones principales */
    .main-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(14px, 2.5vh, 25px);
      width: 100%;
      margin-bottom: clamp(24px, 8vh, 80px);
    }

    .btn {
      padding: clamp(12px, 2vh, 18px) 16px;
      font-size: clamp(20px, 6vw, 28px);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.4s;
      text-align: center;
      width: min(100%, 340px);
    }

    .btn-menu {
      background: linear-gradient(45deg, #FF6200, #FFAA00);
      color: white;
    }

    .btn-menu:hover {
      transform: translateY(-5px) scale(1.05);
    }

    .btn-membresia {
      background: #fff;
      color: #B4700F;
    }

    .btn-membresia:hover {
      transform: translateY(-5px) scale(1.05);
    }

    .btn-recomendar {
      background: transparent;
      color: white;
      border: 3px solid white;
    }

    .btn-recomendar:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-5px);
    }
  </style>
</head>
<body>
  <script src="loader.js"></script>

  <!-- Video de fondo -->
  <video id="background-video" autoplay muted loop playsinline preload="auto" poster="fon-poster.webp">
    <source src="fon.mp4" type="video/mp4">
  </video>

  <div class="container">

    <!-- Barra superior con iconos -->
    <div class="top-bar">
      <!-- Instagram -->
      <a href="https://www.instagram.com/shells_bread" target="_blank" rel="noopener">
        <div class="icon-btn">
          <img src="ig.webp" alt="Instagram" width="40" height="40">
        </div>
      </a>

      <!-- WhatsApp -->
      <a href="https://wa.me/528717345351?text=Hola%20Marce%2C%20quisiera%20hacerte%20un%20pedido%20porfavor." target="_blank" rel="noopener">
        <div class="icon-btn">
          <img src="tel.webp" alt="WhatsApp" width="40" height="40">
        </div>
      </a>
    </div>

    <!-- Logo -->
    <img src="log.webp" alt="Logo Shell's Bread" class="logo" width="600" height="243" style="height:auto">

    <!-- Botones principales -->
    <div class="main-buttons">
      <button class="btn btn-menu" onclick="window.location.href='menu.html'">
        MENÚ
      </button>

      <button class="btn btn-membresia" onclick="window.location.href='membresia.html'">
        MEMBRESÍA
      </button>

      <button class="btn btn-recomendar" onclick="window.open('https://maps.app.goo.gl/EN3fVNwzhTC5LDzV8?g_st=ic', '_blank', 'noopener')">
        RECOMIÉNDANOS
      </button>
    </div>

  </div>

</body>
</html>
