<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membresía - Shell's Bread</title>
    <meta name="description" content="Tarjeta de fidelidad de Shell's Bread: junta sellos y gana premios.">
    <meta name="theme-color" content="#1C1510">
    <link rel="icon" href="wallet/icono-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://firestore.googleapis.com">
    <style>
        :root {
            --gold: #DBA23C;
            --brown: #2A211A;
            --brown-light: #3A2E24;
            --cream: #F4EBDD;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { background: #111; }

        body {
            font-family: 'Poppins', sans-serif;
            color: #fff;
            min-height: 100vh;
            min-height: 100dvh;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                linear-gradient(rgba(15, 10, 6, 0.72), rgba(15, 10, 6, 0.88)),
                url('font.webp') center / cover no-repeat;
        }

        header {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 20px 0;
        }

        .back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            margin-left: -10px;
            color: #fff;
            text-decoration: none;
        }

        .back svg { width: 22px; height: 22px; }

        main {
            max-width: 480px;
            margin: 0 auto;
            padding: 4px 20px 48px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(30px, 9vw, 38px);
            line-height: 1.15;
            text-align: center;
        }

        .lead {
            margin: 10px auto 24px;
            max-width: 340px;
            text-align: center;
            color: var(--cream);
            line-height: 1.5;
        }

        .lead strong { color: var(--gold); }

        /* Tarjeta */
        .card {
            background: linear-gradient(160deg, var(--brown-light), var(--brown));
            border: 1px solid rgba(219, 162, 60, 0.45);
            border-radius: 22px;
            padding: 20px;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
        }

        .card-logo {
            display: block;
            width: 190px;
            max-width: 70%;
            margin: 0 auto -18px;
        }

        .card-owner {
            margin-top: 6px;
            text-align: center;
        }

        .card-owner b { display: block; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
        .card-owner span { font-size: 13px; color: var(--cream); opacity: 0.75; letter-spacing: 1px; }

        .stamps {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 300px;
            margin: 20px auto 16px;
        }

        .stamp {
            position: relative;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px dashed rgba(244, 235, 221, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(244, 235, 221, 0.4);
            font-weight: 600;
            font-size: 20px;
        }

        .stamp svg { display: none; width: 62%; height: 62%; }

        .stamp.filled {
            border: 2px solid var(--gold);
            background: var(--gold);
            color: var(--brown);
        }

        .stamp.filled svg { display: block; }
        .stamp.filled span { display: none; }

        .gift-tag {
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            padding: 1px 7px;
            border-radius: 20px;
            background: #fff;
            color: #8A5A0A;
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
        }

        .card-status {
            text-align: center;
            font-size: 14px;
            color: var(--cream);
            line-height: 1.45;
        }

        .card-status b { color: var(--gold); }

        /* Formulario */
        form { margin-top: 20px; }

        label {
            display: block;
            margin-bottom: 14px;
            font-size: 14px;
            font-weight: 500;
        }

        label small { font-weight: 400; opacity: 0.7; }

        input {
            display: block;
            width: 100%;
            margin-top: 5px;
            padding: 13px 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            font: inherit;
            font-size: 16px; /* evita el zoom automático en iPhone */
            outline: none;
        }

        input:focus { border-color: var(--gold); }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 14px;
            font: inherit;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:active { transform: scale(0.98); }
        .btn[disabled] { cursor: wait; opacity: 0.6; }

        .btn-primary {
            background: linear-gradient(45deg, #FF6200, #FFAA00);
            color: #fff;
            font-size: 18px;
        }

        .btn-wallet {
            background: #000;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.35);
        }

        .btn-wallet svg { width: 22px; height: 22px; flex-shrink: 0; }

        .btn-wallet.soon {
            background: rgba(0, 0, 0, 0.45);
            color: rgba(255, 255, 255, 0.6);
            cursor: default;
        }

        .btn-wallet.soon small { font-weight: 400; font-size: 12px; }

        .btn-link {
            background: none;
            color: var(--cream);
            font-weight: 500;
            font-size: 14px;
            text-decoration: underline;
        }

        .fineprint {
            margin-top: 12px;
            font-size: 12px;
            line-height: 1.4;
            text-align: center;
            color: var(--cream);
            opacity: 0.75;
        }

        .message {
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.45;
        }

        .message.error { background: rgba(190, 40, 30, 0.35); border: 1px solid rgba(255, 120, 100, 0.6); }
        .message.ok { background: rgba(219, 162, 60, 0.18); border: 1px solid var(--gold); text-align: center; margin: 0 0 16px; }
        .message a { color: #fff; font-weight: 600; }

        .section-title {
            margin: 26px 0 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--cream);
        }

        .wallet-buttons { display: grid; gap: 10px; }

        .qr {
            width: 196px;
            margin: 0 auto;
            padding: 10px;
            border-radius: 14px;
            background: #fff;
        }

        .qr svg { display: block; width: 100%; height: auto; }

        .terms {
            margin-top: 16px;
            font-size: 13px;
            color: var(--cream);
        }

        .terms summary { cursor: pointer; text-align: center; font-weight: 500; }
        .terms p { margin-top: 8px; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; }

        [hidden] { display: none !important; }
    </style>
</head>
<body>
<script src="loader.js" data-images="font.webp"></script>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="wheat" viewBox="0 0 24 24">
        <path d="M12 23V8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>
        <ellipse cx="12" cy="4.4" rx="2" ry="3.4" fill="currentColor"/>
        <g fill="currentColor">
            <ellipse cx="8.1" cy="9.7" rx="1.9" ry="3.3" transform="rotate(-38 8.1 9.7)"/>
            <ellipse cx="15.9" cy="9.7" rx="1.9" ry="3.3" transform="rotate(38 15.9 9.7)"/>
            <ellipse cx="8.1" cy="14.2" rx="1.9" ry="3.3" transform="rotate(-38 8.1 14.2)"/>
            <ellipse cx="15.9" cy="14.2" rx="1.9" ry="3.3" transform="rotate(38 15.9 14.2)"/>
            <ellipse cx="8.1" cy="18.7" rx="1.9" ry="3.3" transform="rotate(-38 8.1 18.7)"/>
            <ellipse cx="15.9" cy="18.7" rx="1.9" ry="3.3" transform="rotate(38 15.9 18.7)"/>
        </g>
    </symbol>
</svg>

<header>
    <a class="back" href="index.html" aria-label="Regresar al inicio"><svg class="" viewBox="0 0 448 512" fill="currentColor" aria-hidden="true"><path d="M9.4 233.4c-12.5 12.5-12.5 32.8 0 45.3l160 160c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L109.2 288 416 288c17.7 0 32-14.3 32-32s-14.3-32-32-32l-306.7 0L214.6 118.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0l-160 160z"/></svg></a>
</header>

<main>
    <p id="loading" class="lead">Cargando…</p>

    <!-- ============ REGISTRO ============ -->
    <section id="view-join" hidden>
        <h1>Tarjeta de fidelidad</h1>
        <p class="lead" id="join-lead"></p>

        <div class="card">
            <img class="card-logo" src="log.webp" alt="Shell's Bread">
            <div class="stamps" id="join-stamps"></div>
        </div>

        <details class="terms" data-terms hidden><summary>Reglas y condiciones</summary><p></p></details>

        <form id="join-form" novalidate>
            <label>Nombre
                <input id="name" type="text" autocomplete="name" maxlength="80" required>
            </label>
            <label>Teléfono <small>(10 dígitos)</small>
                <input id="phone" type="tel" autocomplete="tel-national" inputmode="numeric" maxlength="20" required>
            </label>
            <label>Correo <small>(opcional)</small>
                <input id="email" type="email" autocomplete="email" maxlength="120">
            </label>
            <button id="join-btn" class="btn btn-primary" type="submit">Obtener mi tarjeta</button>
            <div id="join-error" class="message error" role="alert" hidden></div>
            <p class="fineprint">Usaremos tus datos solo para administrar tu tarjeta. Una tarjeta por teléfono.</p>
        </form>

        <a id="lost-link" class="btn btn-link" target="_blank" rel="noopener" style="margin-top:10px">Ya tengo tarjeta y no la encuentro</a>
    </section>

    <!-- ============ TARJETA ============ -->
    <section id="view-card" hidden>
        <div id="welcome" class="message ok" hidden></div>

        <div class="card">
            <img class="card-logo" src="log.webp" alt="Shell's Bread">
            <div class="card-owner">
                <b id="card-name"></b>
                <span id="card-code"></span>
            </div>
            <div class="stamps" id="card-stamps"></div>
            <p class="card-status" id="card-status"></p>
        </div>

        <h2 class="section-title">Guárdala en tu celular</h2>
        <div class="wallet-buttons">
            <a id="wallet-apple" class="btn btn-wallet"></a>
            <a id="wallet-google" class="btn btn-wallet"></a>
        </div>

        <h2 class="section-title">Muestra este código en caja para recibir tu sello</h2>
        <div class="qr" id="card-qr"></div>

        <button id="copy-link" class="btn btn-link" type="button" style="margin-top:14px">Copiar el enlace de mi tarjeta</button>

        <details class="terms" data-terms hidden><summary>Reglas y condiciones</summary><p></p></details>
    </section>

    <div id="fatal" class="message error" role="alert" hidden></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
<script type="module">
    import { app } from "./firebase-init.js";
    import { getFirestore, doc, getDoc, onSnapshot, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // ---------- Ajustes ----------
    // Sellos, premio y condiciones se editan en admin.html, pestaña Programa.
    const DEFAULT_PROGRAM = { totalStamps: 6, giftStamps: 2, rewardText: "tu premio", conditions: "" };
    const WHATSAPP = "528717345351";

    const WALLET_URL = "https://us-central1-shells-menu.cloudfunctions.net";
    // Qué tarjetas están activas se lee de wallet-config.json sin caché, para que un
    // HTML guardado en el navegador no muestre un botón equivocado.
    let wallet = { apple: true, google: false };

    // ---------- Utilidades ----------
    const db = getFirestore(app);
    const $ = (id) => document.getElementById(id);
    const STORAGE_KEY = "shells_member_id";
    const programRef = doc(db, "site", "program");
    let program = DEFAULT_PROGRAM;
    let currentCard = null; // { id, member } de la tarjeta en pantalla

    const toProgram = (snap) => ({ ...DEFAULT_PROGRAM, ...(snap.exists() ? snap.data() : {}) });

    function esc(text) {
        const el = document.createElement("div");
        el.textContent = text;
        return el.innerHTML;
    }

    const stored = {
        get() { try { return localStorage.getItem(STORAGE_KEY); } catch { return null; } },
        set(id) { try { localStorage.setItem(STORAGE_KEY, id); } catch { /* el enlace ?id= sigue funcionando */ } },
        clear() { try { localStorage.removeItem(STORAGE_KEY); } catch { /* nada que limpiar */ } }
    };

    function randomId() {
        const bytes = crypto.getRandomValues(new Uint8Array(16));
        return Array.from(bytes, b => b.toString(16).padStart(2, "0")).join("");
    }

    // Acepta "871 734 5351", "+52 1 871..." y devuelve 10 dígitos; "" si no es válido.
    function normalizePhone(raw) {
        const digits = raw.replace(/\D/g, "").replace(/^(?:521|52)(?=\d{10}$)/, "");
        return /^\d{10}$/.test(digits) ? digits : "";
    }

    function whatsappUrl(text) {
        return `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`;
    }

    function renderStamps(container, filled, showGift) {
        const total = program.totalStamps;
        container.innerHTML = "";
        container.style.gridTemplateColumns = `repeat(${total <= 3 ? total : total <= 6 ? 3 : 4}, 1fr)`;
        for (let i = 0; i < total; i++) {
            const stamp = document.createElement("div");
            stamp.className = "stamp" + (i < filled ? " filled" : "");
            stamp.innerHTML = `<span>${i + 1}</span><svg aria-hidden="true"><use href="#wheat"></use></svg>`;
            if (showGift && i < program.giftStamps) {
                stamp.insertAdjacentHTML("beforeend", `<span class="gift-tag" style="display:block">Regalo</span>`);
            }
            container.appendChild(stamp);
        }
    }

    function show(view) {
        $("loading").hidden = true;
        $("view-join").hidden = view !== "join";
        $("view-card").hidden = view !== "card";
    }

    // ---------- Vista de registro ----------
    function renderJoinIntro() {
        renderStamps($("join-stamps"), program.giftStamps, true);
        const gift = program.giftStamps;
        $("join-lead").innerHTML = `Junta <strong>${program.totalStamps} ${program.totalStamps === 1 ? "sello" : "sellos"}</strong> y gana ${esc(program.rewardText)}.`
            + (gift > 0 ? ` Regístrate hoy y <strong>te ${gift === 1 ? "regalamos 1" : `regalamos ${gift}`}</strong>.` : "");
    }

    function renderTerms() {
        document.querySelectorAll("[data-terms]").forEach((terms) => {
            terms.hidden = !program.conditions;
            terms.querySelector("p").textContent = program.conditions;
        });
    }

    function showJoin() {
        renderJoinIntro();
        $("lost-link").href = whatsappUrl("Hola, ya tengo tarjeta de fidelidad y no la encuentro. Mi teléfono es: ");
        show("join");
    }

    function showJoinError(html) {
        $("join-error").innerHTML = html;
        $("join-error").hidden = false;
    }

    $("join-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        $("join-error").hidden = true;

        const name = $("name").value.trim().replace(/\s+/g, " ");
        const phone = normalizePhone($("phone").value);
        const email = $("email").value.trim();

        if (name.length < 2) return showJoinError("Escribe tu nombre.");
        if (!phone) return showJoinError("Escribe un teléfono de 10 dígitos.");
        if (email && !$("email").checkValidity()) return showJoinError("Revisa tu correo o déjalo vacío.");

        const button = $("join-btn");
        button.disabled = true;
        button.textContent = "Creando tu tarjeta…";

        const id = randomId();
        const member = {
            name, phone,
            stamps: program.giftStamps,
            redeemed: 0,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
        };
        if (email) member.email = email;

        try {
            // Por si cambiaron los sellos de regalo desde que se abrió la página.
            program = toProgram(await getDoc(programRef));
            member.stamps = program.giftStamps;

            const batch = writeBatch(db);
            batch.set(doc(db, "members", id), member);
            batch.set(doc(db, "memberPhones", phone), { memberId: id });
            await batch.commit();

            stored.set(id);
            history.replaceState(null, "", `?id=${id}`);
            const gift = program.giftStamps;
            $("welcome").innerHTML = gift > 0
                ? `¡Listo! Ya tienes ${gift === 1 ? "tu <b>sello de regalo</b>" : `tus <b>${gift} sellos de regalo</b>`}.`
                : "¡Listo! Ya tienes tu tarjeta.";
            $("welcome").hidden = false;
            showCard(id);
        } catch (err) {
            console.error("No se pudo crear la tarjeta:", err);
            if (err.code === "permission-denied") {
                // Las reglas solo rechazan aquí un teléfono ya registrado: el resto se validó arriba.
                const url = whatsappUrl(`Hola, ya tengo tarjeta de fidelidad y no la encuentro. Mi teléfono es: ${phone}`);
                showJoinError(`Ese teléfono ya tiene una tarjeta. <a href="${url}" target="_blank" rel="noopener">Escríbenos por WhatsApp</a> y te la enviamos.`);
            } else {
                showJoinError("No pudimos crear tu tarjeta. Revisa tu conexión e inténtalo de nuevo.");
            }
        } finally {
            button.disabled = false;
            button.textContent = "Obtener mi tarjeta";
        }
    });

    // ---------- Vista de tarjeta ----------
    const APPLE_ICON = `<svg class="" viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>`;
    const GOOGLE_ICON = `<svg class="" viewBox="0 0 488 512" fill="currentColor" aria-hidden="true"><path d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"/></svg>`;

    function setupWalletButton(el, enabled, url, icon, label) {
        el.innerHTML = `${icon}<span>Agregar a ${label}</span>`;
        el.classList.toggle("soon", !enabled);
        if (enabled) {
            el.href = url;
            el.removeAttribute("aria-disabled");
        } else {
            el.removeAttribute("href");
            el.setAttribute("aria-disabled", "true");
            el.insertAdjacentHTML("beforeend", "<small>Próximamente</small>");
        }
    }

    function renderWalletButtons(id) {
        setupWalletButton($("wallet-apple"), wallet.apple, `${WALLET_URL}/apple-pass/pass?id=${id}`, APPLE_ICON, "Apple Wallet");
        setupWalletButton($("wallet-google"), wallet.google, `${WALLET_URL}/google-pass?id=${id}`, GOOGLE_ICON, "Google Wallet");
    }

    function renderCard(id, member) {
        currentCard = { id, member };
        const total = program.totalStamps;
        const stamps = Math.min(member.stamps || 0, total);
        const left = total - stamps;
        const reward = esc(program.rewardText);

        $("card-name").textContent = member.name;
        $("card-code").textContent = "SB-" + id.slice(0, 6).toUpperCase();
        renderStamps($("card-stamps"), stamps, false);

        $("card-status").innerHTML = left === 0
            ? `<b>¡Completaste tu tarjeta!</b><br>Muéstrala en caja para recibir ${reward}.`
            : `Tienes <b>${stamps} de ${total}</b> sellos. Te ${left === 1 ? "falta 1" : `faltan ${left}`} para ${reward}.`;
    }

    let unsubscribe = null;

    function showCard(id) {
        if (unsubscribe) unsubscribe();

        renderWalletButtons(id);

        if (window.qrcode) {
            const scanUrl = new URL(`admin.html?miembro=${id}`, location.href).href;
            const qr = window.qrcode(0, "M");
            qr.addData(scanUrl);
            qr.make();
            $("card-qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
        } else {
            $("card-qr").hidden = true;
        }

        unsubscribe = onSnapshot(doc(db, "members", id), (snap) => {
            if (!snap.exists()) {
                stored.clear();
                history.replaceState(null, "", location.pathname);
                showJoin();
                return;
            }
            stored.set(id);
            renderCard(id, snap.data());
            show("card");
        }, (err) => {
            console.error("No se pudo abrir la tarjeta:", err);
            $("loading").hidden = true;
            $("fatal").textContent = "No pudimos abrir tu tarjeta. Revisa tu conexión y vuelve a intentarlo.";
            $("fatal").hidden = false;
        });
    }

    $("copy-link").addEventListener("click", async (e) => {
        const button = e.currentTarget;
        const label = button.textContent;
        try {
            await navigator.clipboard.writeText(location.href);
            button.textContent = "¡Enlace copiado!";
        } catch {
            button.textContent = "Copia el enlace de la barra del navegador";
        }
        setTimeout(() => { button.textContent = label; }, 2500);
    });

    // ---------- Inicio ----------
    fetch(`wallet-config.json?t=${Date.now()}`, { cache: "no-store" })
        .then((res) => (res.ok ? res.json() : null))
        .then((config) => {
            if (!config) return;
            wallet = { ...wallet, ...config };
            if (currentCard) renderWalletButtons(currentCard.id);
        })
        .catch(() => { /* se quedan los valores por defecto */ });

    // Los cambios hechos en admin se ven al instante, aunque la página ya esté abierta.
    let firstProgram;
    window.ShellsLoader?.wait(new Promise((resolve) => { firstProgram = resolve; }));

    onSnapshot(programRef, (snap) => {
        firstProgram();
        program = toProgram(snap);
        renderTerms();
        if (!$("view-join").hidden) renderJoinIntro();
        if (currentCard) renderCard(currentCard.id, currentCard.member);
    }, (err) => {
        firstProgram();
        console.warn("Programa no disponible, usando valores por defecto:", err);
    });

    const urlId = new URLSearchParams(location.search).get("id");
    const memberId = /^[0-9a-f]{32}$/.test(urlId || "") ? urlId : stored.get();

    if (memberId) {
        if (!urlId) history.replaceState(null, "", `?id=${memberId}`);
        showCard(memberId);
    } else {
        showJoin();
    }
</script>
</body>
</html>
