<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Membresía - Shell's Bread</title>
    <link rel="icon" href="wallet/icono-192.png">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1C1510; color: #F4EBDD; font-family: Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
        a { color: #DBA23C; }
    </style>
</head>
<body>
    <!-- La membresía la lleva otro proveedor: esta página solo envía al enlace configurado en admin.html. -->
    <p id="message">Abriendo la membresía…</p>
    <script>
        fetch('https://firestore.googleapis.com/v1/projects/shells-menu/databases/(default)/documents/site/menu?mask.fieldPaths=membershipUrl')
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (doc) {
                var url = doc && doc.fields && doc.fields.membershipUrl && doc.fields.membershipUrl.stringValue;
                location.replace(url && /^https:\/\//i.test(url) ? url : 'index.html');
            })
            .catch(function () {
                document.getElementById('message').innerHTML = 'No pudimos abrir la membresía. <a href="index.html">Volver al inicio</a>';
            });
    </script>
</body>
</html>
