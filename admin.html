    // ---------- Estado ----------
    let state = null;
    const memberParam = new URLSearchParams(location.search).get("miembro") || "";
    let activeTab = null;
    let me = null; // { owner, permissions } de quien inició sesión

    const can = (permission) => !!me && (me.owner || me.permissions[permission] === true);

    const DEFAULT_PROGRAM = { totalStamps: 6, giftStamps: 2, rewardText: "tu premio", conditions: "" };
    let program = { ...DEFAULT_PROGRAM };

    const NON_MENU_TABS = ["scan", "members", "program", "staff"];
    const isMenuTab = () => !NON_MENU_TABS.includes(activeTab);
    let dirty = false;

    const $ = (id) => document.getElementById(id);

    function setStatus(msg, isError) {
        const s = $("status");
        s.textContent = msg;
        s.className = "text-xs " + (isError ? "text-red-400" : "text-white/60");
        if (msg && !isError) setTimeout(() => { if (s.textContent === msg) s.textContent = ""; }, 4000);
    }

    // ---------- Helper para crear elementos ----------
    function h(tag, props = {}, ...children) {
        const e = document.createElement(tag);
        for (const k in props) {
            const v = props[k];
            if (v == null) continue;
            if (k === "class") e.className = v;
            else if (k === "html") e.innerHTML = v;
            else if (k === "value") e.value = v;
            else if (k.startsWith("on") && typeof v === "function") e[k.toLowerCase()] = v;
            else e.setAttribute(k, v);
        }
        for (const c of children.flat()) {
            if (c == null || c === false) continue;
            e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
        }
        return e;
    }

    // ---------- Controles reutilizables ----------
    function textInput(value, placeholder, onInput) {
        return h("input", {
            class: "w-full bg-black/40 border border-white/15 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#F5C400]",
            value: value || "", placeholder: placeholder || "",
            oninput: (e) => { onInput(e.target.value); dirty = true; }
        });
    }
    function textArea(value, placeholder, onInput) {
        return h("textarea", {
            class: "w-full bg-black/40 border border-white/15 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#F5C400]",
            rows: "2", placeholder: placeholder || "",
            oninput: (e) => { onInput(e.target.value); dirty = true; }
        }, value || "");
    }
    function selectInput(value, options, onChange) {
        const sel = h("select", {
            class: "bg-black/40 border border-white/15 rounded-lg px-2 py-1.5 text-sm outline-none focus:border-[#F5C400]",
            onchange: (e) => { onChange(e.target.value); }
        });
        options.forEach(o => {
            const opt = h("option", { value: o.value }, o.label);
            if (o.value === value) opt.selected = true;
            sel.appendChild(opt);
        });
        return sel;
    }
    function labeled(label, control) {
        return h("label", { class: "block" },
            h("span", { class: "block text-xs uppercase tracking-wider text-white/50 mb-1" }, label),
            control);
    }
    const B = {
        primary: "bg-[#F5C400] text-black font-semibold px-4 py-2 rounded-lg hover:brightness-95 transition text-sm",
        ghost: "bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-lg transition text-sm",
        danger: "bg-red-600/80 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg transition text-sm"
    };
    function button(label, cls, onClick) {
        return h("button", { class: cls, onclick: onClick }, label);
    }

    // Vista previa de imagen
    function preview(url, w) {
        const wrap = h("div", {
            class: "relative rounded-lg overflow-hidden border border-white/15 bg-black/40 flex items-center justify-center shrink-0",
            style: `width:${w}px;height:${Math.round(w * 0.64)}px`
        });
        const img = h("img", { class: "w-full h-full object-cover" });
        const ph = h("div", { class: "absolute inset-0 flex flex-col items-center justify-center text-white/40 text-[10px] p-1 text-center break-all" },
            h("i", { class: "fas fa-image text-lg mb-1" }), (url || "sin imagen"));
        const isRemote = url && /^https?:\/\//.test(url);
        ph.style.display = isRemote ? "none" : "flex";
        img.onerror = () => { img.style.display = "none"; ph.style.display = "flex"; };
        img.onload = () => { ph.style.display = "none"; };
        if (url) img.src = /^[\w-]+\.png$/.test(url) ? url.replace(/\.png$/, ".webp") : url;
        wrap.appendChild(img); wrap.appendChild(ph);
        return wrap;
    }

    // ---------- Imágenes: comprimir + subir ----------
    function compress(file, maxDim = 1600, quality = 0.85) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                URL.revokeObjectURL(url);
                let w = img.width, ht = img.height;
                if (w > maxDim || ht > maxDim) {
                    if (w >= ht) { ht = Math.round(ht * maxDim / w); w = maxDim; }
                    else { w = Math.round(w * maxDim / ht); ht = maxDim; }
                }
                const canvas = document.createElement("canvas");
                canvas.width = w; canvas.height = ht;
                canvas.getContext("2d").drawImage(img, 0, 0, w, ht);
                canvas.toBlob(b => b ? resolve(b) : reject(new Error("No se pudo procesar la imagen")), "image/jpeg", quality);
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Archivo de imagen inválido")); };
            img.src = url;
        });
    }
    function pickImage() {
        return new Promise(resolve => {
            const input = document.createElement("input");
            input.type = "file"; input.accept = "image/*";
            input.onchange = () => resolve(input.files[0] || null);
            input.click();
        });
    }
    async function uploadImage(prefix) {
        const file = await pickImage();
        if (!file) return null;
        try {
            setStatus("Subiendo imagen…");
            const blob = await compress(file);
            const path = `menu/${prefix}_${Date.now()}.jpg`;
            const sref = ref(storage, path);
            await uploadBytes(sref, blob, { contentType: "image/jpeg" });
            const url = await getDownloadURL(sref);
            setStatus("Imagen subida ✓");
            return url;
        } catch (e) {
            setStatus("Error al subir la imagen: " + e.message, true);
            return null;
        }
    }
    async function tryDelete(url) {
        try {
            if (url && /^https?:\/\//.test(url) && url.includes("firebasestorage")) {
                await deleteObject(ref(storage, url));
            }
        } catch (e) { /* si falla el borrado del archivo viejo, no bloqueamos */ }
    }

    // ---------- Guardar ----------
    async function save() {
        try {
            setStatus("Guardando…");
            await setDoc(doc(db, "site", "menu"), state);
            dirty = false;
            setStatus("Guardado ✓ Ya se ve en el menú público.");
            return true;
        } catch (e) {
            dirty = true;
            setStatus("Error al guardar: " + e.message, true);
            alert("No se pudo guardar: " + e.message + "\n\nRevisa las reglas de seguridad de Firestore.");
            return false;
        }
    }

    // ---------- Render de pestañas ----------
    function tabList() {
        const list = [];
        if (can("scan")) list.push({ key: "scan", label: "📷 Escanear" });
        if (can("members")) list.push({ key: "members", label: "⭐ Clientes" });
        if (can("program")) list.push({ key: "program", label: "🎁 Programa" });
        if (me?.owner) list.push({ key: "staff", label: "👥 Empleados" });
        if (can("menu") && state) {
            list.push({ key: "global", label: "🖼 Fondo y Logo" });
            state.sections.forEach(s => list.push({ key: s.id, label: s.title || s.id }));
        }
        return list;
    }

    function renderTabs() {
        const tabs = $("tabs");
        tabs.innerHTML = "";
        const list = tabList();
        tabs.classList.toggle("hidden", list.length < 2);
        list.forEach(t => {
            const active = t.key === activeTab;
            const b = h("button", {
                class: "whitespace-nowrap px-3 py-1.5 rounded-full text-sm transition " +
                    (active ? "bg-[#F5C400] text-black font-semibold" : "bg-white/10 hover:bg-white/20 text-white"),
                onclick: () => { activeTab = t.key; renderEditor(); }
            }, t.label);
            tabs.appendChild(b);
        });
    }

                    const url = await uploadImage("background");
                    if (url) { const old = state.background; state.background = url; if (await save()) tryDelete(old); renderEditor(); }

        // Logo
        const logoCard = h("div", { class: "bg-[#161616] border border-white/10 rounded-2xl p-5" },

                })

        // Restaurar por defecto
        const dangerCard = h("div", { class: "bg-[#161616] border border-red-500/20 rounded-2xl p-5" },

            button("Restaurar todo por defecto", B.danger, async () => {

                    state = JSON.parse(JSON.stringify(DEFAULT_DATA));
                    await save();
                    renderEditor();

        wrap.appendChild(bgCard);

    }

    function sectionPanel(sec) {

                    const url = await uploadImage(`${sec.id}/car`);

                    const cell = h("div", { class: "relative" },

        const snap = await getDocs(collection(db, "members"));
        members = snap.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (b.updatedAt?.toMillis?.() || 0) - (a.updatedAt?.toMillis?.() || 0));

        if ((d.stamps || 0) >= program.totalStamps) throw new Error("La tarjeta ya está completa");
        return { stamps: (d.stamps || 0) + 1 };
    };
    const redeemCard = (d) => {
        if ((d.stamps || 0) < program.totalStamps) throw new Error("Aún no completa sus sellos");

    async function changeStamps(member, change) {
        const refMember = doc(db, "members", member.id);
        const updated = await runTransaction(db, async (tx) => {
            const snap = await tx.get(refMember);
            if (!snap.exists()) throw new Error("La tarjeta ya no existe");
            const next = change(snap.data());
            tx.update(refMember, { ...next, updatedAt: serverTimestamp() });
            return next;
        });
        Object.assign(member, updated);
    }

    function memberRow(member, rerender) {
        const stamps = member.stamps || 0;

    // ---------- Escáner ----------
    let scanner = null;      // cámara encendida
    let scannedMember = null; // { id, name, stamps, redeemed }
    let scanMessage = "";

    function stopScanner() {
        if (!scanner) return;
        clearTimeout(scanner.timer);
        scanner.stream.getTracks().forEach(t => t.stop());
        scanner = null;
    }

    async function openScannedCard(id) {
        const [snap] = await Promise.all([getDoc(doc(db, "members", id)), loadProgram()]);
        if (!snap.exists()) {
            scanMessage = "Esa tarjeta ya no existe.";
            scannedMember = null;
            return;
        }
        scanMessage = "";
        scannedMember = { id, ...snap.data() };
    }

    async function startScanner(video, onMessage) {
        if (!navigator.mediaDevices?.getUserMedia) {
            onMessage("Este navegador no permite usar la cámara. Abre el admin con Safari o Chrome.");
            return;
        }
        let stream;
        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        } catch (e) {
            onMessage(e.name === "NotAllowedError"
                ? "Falta dar permiso a la cámara. Actívalo en los ajustes del navegador y vuelve a intentarlo."
                : "No se pudo abrir la cámara: " + e.message);
            return;
        }
        // Si cambiaron de pestaña mientras se pedía el permiso, no dejar la cámara encendida.
        if (activeTab !== "scan" || !video.isConnected) {
            stream.getTracks().forEach(t => t.stop());
            return;
        }
        video.srcObject = stream;
        await video.play().catch(() => {});

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        scanner = { stream, timer: null };

        const tick = async () => {
            if (!scanner) return;
            if (video.videoWidth && window.jsQR) {
                const scale = Math.min(1, 640 / video.videoWidth);
                canvas.width = Math.round(video.videoWidth * scale);
                canvas.height = Math.round(video.videoHeight * scale);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const code = window.jsQR(ctx.getImageData(0, 0, canvas.width, canvas.height).data, canvas.width, canvas.height);
                if (code?.data) {
                    // Solo se lee el id de la tarjeta; nunca se abre lo que traiga el código.
                    const match = code.data.match(/[?&]miembro=([0-9a-f]{32})(?:$|&)/);
                    if (match) {
                        stopScanner();
                        navigator.vibrate?.(80);
                        try {
                            await openScannedCard(match[1]);
                        } catch (e) {
                            scanMessage = "No se pudo abrir la tarjeta: " + e.message;
                        }
                        renderEditor();
                        return;
                    }
                    onMessage("Ese código no es una tarjeta de Shell's Bread.");
                }
            }
            if (scanner) scanner.timer = setTimeout(tick, 200);
        };
        tick();
    }

    function scanPanel() {
        if (scannedMember) return scannedCardPanel();

        const message = h("p", { class: "text-sm text-center text-[#F5C400] min-h-[20px]" }, scanMessage);
        scanMessage = "";

        const wrap = h("div", { class: "bg-[#161616] border border-white/10 rounded-2xl p-5 space-y-4 max-w-md mx-auto" },

                h("div", { class: "absolute inset-[12%] border-4 border-[#F5C400]/80 rounded-2xl pointer-events-none" })),
            message
        );
        startScanner(video, (text) => { message.textContent = text; });
        return wrap;
    }

    function scannedCardPanel() {
        const member = scannedMember;
        const stamps = member.stamps || 0;
        const complete = stamps >= program.totalStamps;
        const left = program.totalStamps - stamps;

        const run = (change, okMsg) => async () => {
            try {
                await changeStamps(member, change);
                members = null; // la lista de clientes se recarga con el dato nuevo
                scanMessage = okMsg;
            } catch (e) {
                scanMessage = "No se pudo actualizar: " + e.message;
            }
            renderEditor();

        const big = "w-full py-4 rounded-xl text-lg font-semibold transition ";
        const message = h("p", { class: "text-sm text-center text-[#F5C400] min-h-[20px]" }, scanMessage);

            h("div", {},
                h("div", { class: "text-xl font-semibold break-words" }, member.name || "(sin nombre)"),
                h("div", { class: "text-white/50 text-sm" }, memberCode(member.id))),
            h("div", { class: "flex justify-center" }, stampDots(stamps)),

                            await run(redeemCard, "Premio canjeado ✓")();
                        }

            h("button", {
                class: big + "bg-white/10 hover:bg-white/20 text-white",
                onclick: () => { scannedMember = null; renderEditor(); }

    // ---------- Programa de fidelidad ----------
    function programPanel() {
        const inputClass = "w-full bg-black/40 border border-white/15 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#F5C400]";
        const total = h("input", { class: inputClass, type: "number", min: "1", max: "12", value: String(program.totalStamps) });
        const gift = h("input", { class: inputClass, type: "number", min: "0", max: "12", value: String(program.giftStamps) });
        const reward = h("input", { class: inputClass, maxlength: "120", value: program.rewardText, placeholder: "Ej. un pan dulce gratis" });
        const conditions = h("textarea", { class: inputClass, rows: "6", maxlength: "2000", placeholder: "Ej. Un sello por compra. No acumulable con otras promociones." }, program.conditions || "");
        const error = h("p", { class: "text-red-400 text-sm min-h-[20px]" });

        const saveProgram = async () => {
            error.textContent = "";
            const next = {
                totalStamps: Number(total.value),
                giftStamps: Number(gift.value),
                rewardText: reward.value.trim(),
                conditions: conditions.value.trim()
            };
            if (!Number.isInteger(next.totalStamps) || next.totalStamps < 1 || next.totalStamps > 12) {
                error.textContent = "Los sellos para el premio deben ser entre 1 y 12.";
                return;
            }
            if (!Number.isInteger(next.giftStamps) || next.giftStamps < 0 || next.giftStamps > next.totalStamps) {
                error.textContent = "Los sellos de regalo no pueden ser más que los sellos para el premio.";
                return;
            }
            if (!next.rewardText) {
                error.textContent = "Escribe el premio.";
                return;
            }
            try {
                await setDoc(doc(db, "site", "program"), next);
                program = next;
                setStatus("Programa guardado ✓ Ya se ve en la página de membresía.");
            } catch (e) {
                error.textContent = "No se pudo guardar: " + e.message;
            }
        };

        return h("div", { class: "bg-[#161616] border border-white/10 rounded-2xl p-5 space-y-4 max-w-xl" },
            h("h3", { class: "font-semibold text-lg" }, "Programa de fidelidad"),
            h("div", { class: "grid grid-cols-2 gap-3" },
                labeled("Sellos para el premio", total),
                labeled("Sellos de regalo al registrarse", gift)),
            labeled("Premio", reward),
            h("p", { class: "text-white/40 text-xs -mt-2" }, "Se lee así: \"Te faltan 3 para [premio]\"."),
            labeled("Reglas y condiciones", conditions),
            h("p", { class: "text-white/40 text-xs" }, "Los sellos de regalo solo aplican a tarjetas nuevas. Si bajas los sellos para el premio, las tarjetas que ya lleguen al nuevo total podrán canjearlo."),
            error,
            button("Guardar programa", B.primary, saveProgram)
        );
    }

    // ---------- Empleados ----------
    const PERMISSIONS = [
        { key: "scan", label: "Escanear tarjetas, dar sellos y canjear premios" },
        { key: "members", label: "Ver clientes y corregir sellos" },
        { key: "menu", label: "Editar el menú y sus fotos" },

    let staffList = null;

    async function loadStaff() {
        const snap = await getDocs(collection(db, "staff"));
        staffList = snap.docs
            .map(d => ({ uid: d.id, ...d.data() }))
            .sort((a, b) => (a.name || "").localeCompare(b.name || ""));

    function permissionCheckbox(label, checked, onChange) {
        const box = h("input", { type: "checkbox", class: "w-4 h-4 mt-0.5 accent-[#F5C400] shrink-0" });
        box.checked = checked;
        box.onchange = () => onChange(box);
        return h("label", { class: "flex items-start gap-2 text-sm" }, box, h("span", {}, label));
    }

    function staffRow(person) {
        const update = async (fields, box, previous) => {
            try {
                await updateDoc(doc(db, "staff", person.uid), fields);
                setStatus("Guardado ✓");
                return true;
            } catch (e) {
                if (box) box.checked = previous;
                setStatus("No se pudo guardar: " + e.message, true);
                return false;
            }
        };
        const active = person.active === true;

        return h("div", { class: "bg-[#161616] border border-white/10 rounded-2xl p-4 space-y-3 " + (active ? "" : "opacity-60") },
            h("div", { class: "flex items-center justify-between gap-3 flex-wrap" },
                h("div", {},
                    h("div", { class: "font-semibold" }, person.name || person.username),
                    h("div", { class: "text-white/50 text-sm" }, `Usuario: ${person.username}${active ? "" : " · Sin acceso"}`)),
                button(active ? "Quitar acceso" : "Devolver acceso", active ? B.danger : B.ghost, async () => {
                    if (active && !confirm(`¿Quitarle el acceso a ${person.name}?`)) return;
                    if (await update({ active: !active })) { person.active = !active; renderEditor(); }
                })
            ),
            h("div", { class: "space-y-2" }, PERMISSIONS.map(p =>
                permissionCheckbox(p.label, person.permissions?.[p.key] === true, async (box) => {
                    const ok = await update({ [`permissions.${p.key}`]: box.checked }, box, !box.checked);
                    if (ok) person.permissions = { ...person.permissions, [p.key]: box.checked };
                })
            ))
        );
    }

    function staffPanel() {
        const inputClass = "w-full bg-black/40 border border-white/15 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#F5C400]";
        const name = h("input", { class: inputClass, maxlength: "60", autocomplete: "off" });
        const username = h("input", { class: inputClass, maxlength: "30", autocomplete: "off", autocapitalize: "none", placeholder: "Ej. pedro" });
        const password = h("input", { class: inputClass, type: "text", autocomplete: "new-password", placeholder: "Mínimo 6 caracteres" });
        const chosen = { scan: true };
        const error = h("p", { class: "text-red-400 text-sm min-h-[20px]" });
        const list = h("div", { class: "space-y-3" }, h("p", { class: "text-white/50 text-sm" }, "Cargando empleados…"));

        const renderStaffList = () => {
            list.innerHTML = "";
            if (!staffList.length) list.appendChild(h("p", { class: "text-white/50 text-sm" }, "Todavía no hay empleados."));
            staffList.forEach(p => list.appendChild(staffRow(p)));
        };

        const addBtn = button("Crear empleado", B.primary, async () => {
            error.textContent = "";
            const user = username.value.trim().toLowerCase();
            if (name.value.trim().length < 2) { error.textContent = "Escribe el nombre."; return; }
            if (!/^[a-z0-9._-]{3,30}$/.test(user)) { error.textContent = "El usuario debe tener de 3 a 30 letras o números, sin espacios."; return; }
            if (password.value.length < 6) { error.textContent = "La contraseña debe tener al menos 6 caracteres."; return; }

            addBtn.disabled = true;
            const secondaryAuth = getAuth(secondaryApp());
            try {
                const email = `${user}@${DOMINIO_ADMIN}`;
                const cred = await createUserWithEmailAndPassword(secondaryAuth, email, password.value);
                const person = {
                    name: name.value.trim(), username: user, email, active: true,
                    permissions: Object.fromEntries(PERMISSIONS.map(p => [p.key, chosen[p.key] === true]))
                };
                await setDoc(doc(db, "staff", cred.user.uid), person);
                staffList.push({ uid: cred.user.uid, ...person });
                setStatus(`Empleado creado ✓ Usuario: ${user}`);
                renderEditor();
            } catch (e) {
                const map = {
                    "auth/email-already-in-use": "Ese usuario ya existe. Elige otro.",
                    "auth/weak-password": "La contraseña es muy débil.",
                    "auth/operation-not-allowed": "Falta habilitar 'Correo/contraseña' en Firebase Authentication."
                };
                error.textContent = map[e.code] || ("No se pudo crear: " + e.message);
            } finally {
                await signOut(secondaryAuth).catch(() => {});
                addBtn.disabled = false;
            }
        });

        const wrap = h("div", { class: "space-y-4" },
            h("div", { class: "bg-[#161616] border border-white/10 rounded-2xl p-5 space-y-3 max-w-xl" },
                h("h3", { class: "font-semibold text-lg" }, "Agregar empleado"),
                labeled("Nombre", name),
                labeled("Usuario para entrar", username),
                labeled("Contraseña", password),
                h("div", { class: "space-y-2 pt-1" },
                    h("span", { class: "block text-xs uppercase tracking-wider text-white/50" }, "Qué puede hacer"),
                    PERMISSIONS.map(p => permissionCheckbox(p.label, chosen[p.key] === true, (box) => { chosen[p.key] = box.checked; }))),
                error,
                addBtn,
                h("p", { class: "text-white/40 text-xs" }, "Para cambiar la contraseña de un empleado, quítale el acceso y crea un usuario nuevo.")
            ),
            list
        );

        if (staffList) renderStaffList();
        else loadStaff().then(renderStaffList).catch(e => setStatus("Error al cargar empleados: " + e.message, true));
        return wrap;
    }

    // ---------- Render principal del editor ----------
    function renderEditor() {
        stopScanner();
        renderTabs();
        const menuTab = isMenuTab();
        $("save-btn").classList.toggle("hidden", !menuTab);
        $("view-menu").classList.toggle("hidden", !can("menu"));
        $("menu-note").classList.toggle("hidden", !menuTab);

        const panel = $("panel");
        panel.innerHTML = "";
        if (activeTab === "scan") {
            panel.appendChild(scanPanel());
        } else if (activeTab === "members") {
            panel.appendChild(membersPanel());
        } else if (activeTab === "program") {
            panel.appendChild(programPanel());
        } else if (activeTab === "staff") {
            panel.appendChild(staffPanel());
        } else if (activeTab === "global") {
            panel.appendChild(globalPanel());
        } else if (state) {
            const sec = state.sections.find(s => s.id === activeTab) || state.sections[0];
            if (sec) { activeTab = sec.id; panel.appendChild(sectionPanel(sec)); }
        }
    }

    // ---------- Cargar datos ----------
    async function loadData() {
        setStatus("Cargando menú…");
        const refDoc = doc(db, "site", "menu");
        const snap = await getDoc(refDoc);
        if (snap.exists()) {
            state = snap.data();
            // Asegurar estructura mínima
            state.sections = state.sections || [];
        } else {
            state = JSON.parse(JSON.stringify(DEFAULT_DATA));
            await setDoc(refDoc, state); // sembrar el menú por primera vez
        }
        dirty = false;
        setStatus("");
    }

    // ---------- Autenticación ----------
    $("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const err = $("login-error");
        err.textContent = "";
        const btn = $("login-btn");
        btn.disabled = true; btn.textContent = "Entrando…";
        let usuario = $("usuario").value.trim();
        const pass = $("password").value;
        const email = usuario.includes("@") ? usuario : `${usuario}@${DOMINIO_ADMIN}`;
        try {
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (ex) {
            const map = {
                "auth/invalid-credential": "Usuario o contraseña incorrectos.",
                "auth/wrong-password": "Contraseña incorrecta.",
                "auth/user-not-found": "Ese usuario no existe. ¿Ya lo creaste en Firebase Authentication?",
                "auth/invalid-email": "El usuario no es válido.",
                "auth/operation-not-allowed": "Falta habilitar 'Email/Password' en Firebase Authentication.",
                "auth/too-many-requests": "Demasiados intentos. Espera un momento e inténtalo de nuevo."
            };
            err.textContent = map[ex.code] || ("Error: " + ex.message);
        } finally {
            btn.disabled = false; btn.textContent = "Entrar";
        }
    });

    $("logout-btn").addEventListener("click", () => {
        if (dirty && !confirm("Tienes cambios de texto sin guardar. ¿Salir de todos modos?")) return;
        signOut(auth);
    });

    $("save-btn").addEventListener("click", save);

    window.addEventListener("beforeunload", (e) => {
        if (dirty) { e.preventDefault(); e.returnValue = ""; }
    });

    // Permisos de quien inició sesión; null si la cuenta no tiene acceso.
    async function loadMe(user) {
        if (user.email === CORREO_DUENA) return { owner: true, permissions: {} };
        const snap = await getDoc(doc(db, "staff", user.uid));
        if (!snap.exists() || snap.data().active !== true) return null;
        return { owner: false, permissions: snap.data().permissions || {} };
    }

    async function loadProgram() {
        const snap = await getDoc(doc(db, "site", "program"));
        program = { ...DEFAULT_PROGRAM, ...(snap.exists() ? snap.data() : {}) };
    }

    // Abre la tarjeta si se llegó escaneando el QR con la cámara del celular.
    async function openFromUrl() {
        if (!memberParam) return;
        history.replaceState(null, "", location.pathname);
        if (can("scan")) {
            activeTab = "scan";
            await openScannedCard(memberParam);
        } else if (can("members")) {
            activeTab = "members";
        }
    }

    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            stopScanner();
            me = null; state = null; members = null; staffList = null; scannedMember = null; activeTab = null;
            $("app").classList.add("hidden");
            $("login").classList.remove("hidden");
            $("password").value = "";
            return;
        }
        try {
            me = await loadMe(user);
            if (!me) {
                $("login-error").textContent = "Esta cuenta no tiene acceso.";
                await signOut(auth);
                return;
            }
            $("login").classList.add("hidden");
            $("app").classList.remove("hidden");
            await loadProgram();
            if (can("menu")) await loadData();
            activeTab = tabList()[0]?.key || null;
            await openFromUrl();
            if (activeTab) {
                renderEditor();
            } else {
                $("panel").textContent = "Tu usuario todavía no tiene permisos asignados.";
                $("save-btn").classList.add("hidden");
                $("view-menu").classList.add("hidden");
                $("menu-note").classList.add("hidden");
            }
        } catch (e) {
            setStatus("Error al cargar: " + e.message, true);
            $("login-error").textContent = "No se pudo cargar: " + e.message;
        }
    });
</script>
</body>
</html>
