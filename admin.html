    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap');
        html { background-color:#0d0d0d; }

        .logo-font { font-family:'Playfair Display', serif; }

<body class="min-h-screen">

<!-- ================= LOGIN ================= -->
<div id="login" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-[#161616] border border-white/10 rounded-3xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <div class="logo-font text-3xl font-bold text-[#F5C400]">Shell's Bread</div>
            <p class="text-white/50 text-sm mt-1">Panel de administración</p>
        </div>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs uppercase tracking-wider text-white/50 mb-1">Usuario</label>
                <input id="usuario" type="text" autocomplete="username" value="marce"
                       class="w-full bg-black/40 border border-white/15 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-[#F5C400]">
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider text-white/50 mb-1">Contraseña</label>
                <input id="password" type="password" autocomplete="current-password"
                       class="w-full bg-black/40 border border-white/15 rounded-lg px-3 py-2.5 text-sm outline-none focus:border-[#F5C400]">
            </div>
            <button type="submit" id="login-btn"
                    class="w-full bg-[#F5C400] text-black font-semibold py-2.5 rounded-lg hover:brightness-95 transition">
                Entrar
            </button>
            <p id="login-error" class="text-red-400 text-sm text-center min-h-[20px]"></p>
        </form>
    </div>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
    <!-- Barra superior -->
    <header class="sticky top-0 z-40 bg-[#0d0d0d]/95 backdrop-blur border-b border-white/10">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-3 flex-wrap">
            <div class="logo-font text-xl font-bold text-[#F5C400] mr-auto">Shell's Bread · Admin</div>
            <span id="status" class="text-xs text-white/60"></span>
            <a href="menu.html" target="_blank"
               class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg transition">
               <i class="fas fa-eye mr-1"></i> Ver menú
            </a>
            <button id="save-btn"
                    class="text-sm bg-[#F5C400] text-black font-semibold px-4 py-1.5 rounded-lg hover:brightness-95 transition">
                <i class="fas fa-floppy-disk mr-1"></i> Guardar cambios
            </button>
            <button id="logout-btn"
                    class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg transition">
                Salir
            </button>
        </div>
        <!-- Pestañas -->
        <div id="tabs" class="max-w-5xl mx-auto px-4 pb-2 flex gap-2 overflow-x-auto"></div>
    </header>

    <main id="panel" class="max-w-5xl mx-auto px-4 py-6"></main>

    <footer class="max-w-5xl mx-auto px-4 pb-16 text-center text-white/30 text-xs">
        Los cambios de texto y precio se aplican al presionar <b>Guardar cambios</b>.
        Las fotos se guardan al instante en cuanto las subes o quitas.
    </footer>
</div>

    // ---------- Estado ----------
    let state = null;
    let activeTab = "global";

    const $ = (id) => document.getElementById(id);

    function setStatus(msg, isError) {
        const s = $("status");
        s.textContent = msg;
        s.className = "text-xs " + (isError ? "text-red-400" : "text-white/60");
        if (msg && !isError) setTimeout(() => { if (s.textContent === msg) s.textContent = ""; }, 4000);
    }

    // ---------- Helper para crear elementos ----------
    function h(tag, props = {}, ...children) {
        const e = document.createElement(tag);
        for (const k in props) {
            const v = props[k];
            if (v == null) continue;
            if (k === "class") e.className = v;
            else if (k === "html") e.innerHTML = v;
            else if (k === "value") e.value = v;
            else if (k.startsWith("on") && typeof v === "function") e[k.toLowerCase()] = v;
            else e.setAttribute(k, v);
        }
        for (const c of children.flat()) {
            if (c == null || c === false) continue;
            e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
        }
        return e;
    }

    // ---------- Controles reutilizables ----------
    function textInput(value, placeholder, onInput) {
        return h("input", {
            class: "w-full bg-black/40 border border-white/15 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#F5C400]",
            value: value || "", placeholder: placeholder || "",
            oninput: (e) => { onInput(e.target.value); dirty = true; }
        });
    }
    function textArea(value, placeholder, onInput) {
        return h("textarea", {
            class: "w-full bg-black/40 border border-white/15 rounded-lg px-3 py-2 text-sm outline-none focus:border-[#F5C400]",
            rows: "2", placeholder: placeholder || "",
            oninput: (e) => { onInput(e.target.value); dirty = true; }
        }, value || "");
    }
    function selectInput(value, options, onChange) {
        const sel = h("select", {
            class: "bg-black/40 border border-white/15 rounded-lg px-2 py-1.5 text-sm outline-none focus:border-[#F5C400]",
            onchange: (e) => { onChange(e.target.value); }
        });
        options.forEach(o => {
            const opt = h("option", { value: o.value }, o.label);
            if (o.value === value) opt.selected = true;
            sel.appendChild(opt);
        });
        return sel;
    }
    function labeled(label, control) {
        return h("label", { class: "block" },
            h("span", { class: "block text-xs uppercase tracking-wider text-white/50 mb-1" }, label),
            control);
    }
    const B = {
        primary: "bg-[#F5C400] text-black font-semibold px-4 py-2 rounded-lg hover:brightness-95 transition text-sm",
        ghost: "bg-white/10 hover:bg-white/20 text-white px-3 py-1.5 rounded-lg transition text-sm",
        danger: "bg-red-600/80 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg transition text-sm"
    };
    function button(label, cls, onClick) {
        return h("button", { class: cls, onclick: onClick }, label);
    }

    // Vista previa de imagen
    function preview(url, w) {
        const wrap = h("div", {
            class: "relative rounded-lg overflow-hidden border border-white/15 bg-black/40 flex items-center justify-center shrink-0",
            style: `width:${w}px;height:${Math.round(w * 0.64)}px`
        });
        const img = h("img", { class: "w-full h-full object-cover" });
        const ph = h("div", { class: "absolute inset-0 flex flex-col items-center justify-center text-white/40 text-[10px] p-1 text-center break-all" },
            h("i", { class: "fas fa-image text-lg mb-1" }), (url || "sin imagen"));
        const isRemote = url && /^https?:\/\//.test(url);
        ph.style.display = isRemote ? "none" : "flex";
        img.onerror = () => { img.style.display = "none"; ph.style.display = "flex"; };
        img.onload = () => { ph.style.display = "none"; };
        if (url) img.src = url;
        wrap.appendChild(img); wrap.appendChild(ph);
        return wrap;
    }

    // ---------- Imágenes: comprimir + subir ----------
    function compress(file, maxDim = 1600, quality = 0.85) {
        return new Promise((resolve, reject) => {
            const img = new Image();
            const url = URL.createObjectURL(file);
            img.onload = () => {
                URL.revokeObjectURL(url);
                let w = img.width, ht = img.height;
                if (w > maxDim || ht > maxDim) {
                    if (w >= ht) { ht = Math.round(ht * maxDim / w); w = maxDim; }
                    else { w = Math.round(w * maxDim / ht); ht = maxDim; }
                }
                const canvas = document.createElement("canvas");
                canvas.width = w; canvas.height = ht;
                canvas.getContext("2d").drawImage(img, 0, 0, w, ht);
                canvas.toBlob(b => b ? resolve(b) : reject(new Error("No se pudo procesar la imagen")), "image/jpeg", quality);
            };
            img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Archivo de imagen inválido")); };
            img.src = url;
        });
    }
    function pickImage() {
        return new Promise(resolve => {
            const input = document.createElement("input");
            input.type = "file"; input.accept = "image/*";
            input.onchange = () => resolve(input.files[0] || null);
            input.click();
        });
    }
    async function uploadImage(prefix) {
        const file = await pickImage();
        if (!file) return null;
        try {
            setStatus("Subiendo imagen…");
            const blob = await compress(file);
            const path = `menu/${prefix}_${Date.now()}.jpg`;
            const sref = ref(storage, path);
            await uploadBytes(sref, blob, { contentType: "image/jpeg" });
            const url = await getDownloadURL(sref);
            setStatus("Imagen subida ✓");
            return url;
        } catch (e) {
            setStatus("Error al subir la imagen: " + e.message, true);
            return null;
        }
    }
    async function tryDelete(url) {
        try {
            if (url && /^https?:\/\//.test(url) && url.includes("firebasestorage")) {
                await deleteObject(ref(storage, url));
            }
        } catch (e) { /* si falla el borrado del archivo viejo, no bloqueamos */ }
    }

    // ---------- Guardar ----------
    async function save() {
        try {
            setStatus("Guardando…");
            await setDoc(doc(db, "site", "menu"), state);
            dirty = false;
            setStatus("Guardado ✓ Ya se ve en el menú público.");
        } catch (e) {
            setStatus("Error al guardar: " + e.message, true);
            alert("No se pudo guardar: " + e.message + "\n\nRevisa las reglas de seguridad de Firestore.");
        }
    }

        const list = [{ key: "global", label: "🖼 Fondo y Logo" }]

                onclick: () => { activeTab = t.key; renderEditor(); }
            }, t.label);
            tabs.appendChild(b);
        });
    }

                    const url = await uploadImage("logo");
                    if (url) { const old = state.logo; state.logo = url; await save(); tryDelete(old); renderEditor(); }
                })

        // Restaurar por defecto
        const dangerCard = h("div", { class: "bg-[#161616] border border-red-500/20 rounded-2xl p-5" },
            h("h3", { class: "font-semibold text-lg mb-1 text-red-300" }, "Restaurar menú original"),
            h("p", { class: "text-white/50 text-sm mb-4" }, "Vuelve todo el menú (textos, precios y fotos) a como venía de fábrica. Úsalo con cuidado."),
            button("Restaurar todo por defecto", B.danger, async () => {
                if (confirm("¿Seguro que quieres restaurar TODO el menú al original? Se perderán tus cambios de texto y las fotos que hayas subido dejarán de mostrarse.")) {
                    state = JSON.parse(JSON.stringify(DEFAULT_DATA));
                    await save();
                    renderEditor();

        wrap.appendChild(bgCard);
        wrap.appendChild(logoCard);
        wrap.appendChild(dangerCard);
        return wrap;

    // ---------- Panel de una sección ----------
    function sectionPanel(sec) {
        const wrap = h("div", { class: "space-y-6" });

        // Carrusel

                button("+ Agregar foto", B.primary, async () => {
                    const url = await uploadImage(`${sec.id}/car`);
                    if (url) { (sec.carousel = sec.carousel || []).push(url); await save(); renderEditor(); }
                })
            ),
            (function () {
                const grid = h("div", { class: "flex flex-wrap gap-3" });
                (sec.carousel || []).forEach((url, i) => {
                    const cell = h("div", { class: "relative" },
                        preview(url, 150),
                        h("button", {
                            class: "absolute -top-2 -right-2 bg-red-600 hover:bg-red-500 text-white w-7 h-7 rounded-full text-sm shadow-lg",
                            title: "Quitar esta foto",
                            onclick: async () => {
                                if (!confirm("¿Quitar esta foto del carrusel?")) return;
                                const [removed] = sec.carousel.splice(i, 1);
                                await save(); tryDelete(removed); renderEditor();
                            }
                        }, "✕")
                    );
                    grid.appendChild(cell);
                });
                if (!(sec.carousel || []).length) {
                    grid.appendChild(h("p", { class: "text-white/40 text-sm" }, "No hay fotos en el carrusel."));
                }
                return grid;
            })()
        );

        // Grupos y platillos
        const groupsCard = h("div", { class: "space-y-4" });
        groupsCard.appendChild(h("div", { class: "flex items-center justify-between flex-wrap gap-2" },
            h("h3", { class: "font-semibold text-lg" }, "Menú de esta sección"),
            button("+ Agregar grupo", B.ghost, () => {
                sec.groups.push({ heading: "", layout: "list", items: [{ name: "", desc: "", price: "" }] });
                dirty = true; renderEditor();
            })
        ));

        (sec.groups || []).forEach((group, gi) => {
            groupsCard.appendChild(groupCard(sec, group, gi));
        });

        // Nota al pie
        const noteCard = h("div", { class: "bg-[#161616] border border-white/10 rounded-2xl p-5" },
            labeled("Nota al pie (opcional, ej. 'Extras: ...')", textArea(sec.note, "Escribe una nota o déjala vacía", v => sec.note = v))
        );

        wrap.appendChild(head);
        wrap.appendChild(carCard);
        wrap.appendChild(groupsCard);
        wrap.appendChild(noteCard);
        return wrap;
    }

    // ---------- Tarjeta de un grupo ----------
    function groupCard(sec, group, gi) {
        const layoutOptions = [
            { value: "list", label: "Lista con descripción y precio" },
            { value: "grid2", label: "Cuadrícula (nombre — precio)" },
            { value: "priceRow", label: "Lista simple (nombre + precio)" }
        ];

        const card = h("div", { class: "bg-[#161616] border border-white/10 rounded-2xl p-5 space-y-3" });

        // Encabezado del grupo
        card.appendChild(h("div", { class: "flex items-end gap-3 flex-wrap" },
            h("div", { class: "flex-1 min-w-[180px]" },
                labeled("Título del grupo (opcional)", textInput(group.heading, "Ej. HOGAZAS (deja vacío si no aplica)", v => group.heading = v))),
            h("div", {},
                h("span", { class: "block text-xs uppercase tracking-wider text-white/50 mb-1" }, "Estilo"),
                selectInput(group.layout, layoutOptions, v => { group.layout = v; dirty = true; renderEditor(); })),
            button("Quitar grupo", B.danger, () => {
                if (confirm("¿Quitar este grupo completo con todos sus platillos?")) {
                    sec.groups.splice(gi, 1); dirty = true; renderEditor();
                }
            })
        ));

        // Platillos
        const itemsBox = h("div", { class: "space-y-2" });
        (group.items || []).forEach((item, ii) => {
            const showDesc = group.layout === "list";
            const row = h("div", { class: "grid gap-2 items-start bg-black/20 rounded-xl p-3", style: "grid-template-columns: 1fr auto;" });

            const fields = h("div", { class: "space-y-2" },
                textInput(item.name, "Nombre del platillo", v => item.name = v),
                showDesc ? textInput(item.desc, "Descripción (opcional)", v => item.desc = v) : null,
                textInput(item.price, "Precio (ej. $120)", v => item.price = v)
            );

            const rm = button("✕", B.danger + " h-9", () => {
                group.items.splice(ii, 1); dirty = true; renderEditor();
            });

            row.appendChild(fields);
            row.appendChild(rm);
            itemsBox.appendChild(row);
        });
        card.appendChild(itemsBox);

        card.appendChild(button("+ Agregar platillo", B.ghost, () => {
            group.items.push({ name: "", desc: "", price: "" });
            dirty = true; renderEditor();
        }));

        return card;
    }

    // ---------- Render principal del editor ----------
    function renderEditor() {
        renderTabs();
        const panel = $("panel");
        panel.innerHTML = "";
        if (activeTab === "global") {
            panel.appendChild(globalPanel());
        } else {
            const sec = state.sections.find(s => s.id === activeTab) || state.sections[0];
            if (sec) { activeTab = sec.id; panel.appendChild(sectionPanel(sec)); }
        }
    }

    // ---------- Cargar datos ----------
    async function loadData() {
        setStatus("Cargando menú…");
        const refDoc = doc(db, "site", "menu");
        const snap = await getDoc(refDoc);
        if (snap.exists()) {
            state = snap.data();
            // Asegurar estructura mínima
            state.sections = state.sections || [];
        } else {
            state = JSON.parse(JSON.stringify(DEFAULT_DATA));
            await setDoc(refDoc, state); // sembrar el menú por primera vez
        }
        dirty = false;
        renderEditor();
        setStatus("");
    }

    // ---------- Autenticación ----------
    $("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const err = $("login-error");
        err.textContent = "";
        const btn = $("login-btn");
        btn.disabled = true; btn.textContent = "Entrando…";
        let usuario = $("usuario").value.trim();
        const pass = $("password").value;
        const email = usuario.includes("@") ? usuario : `${usuario}@${DOMINIO_ADMIN}`;
        try {
            await signInWithEmailAndPassword(auth, email, pass);
        } catch (ex) {
            const map = {
                "auth/invalid-credential": "Usuario o contraseña incorrectos.",
                "auth/wrong-password": "Contraseña incorrecta.",
                "auth/user-not-found": "Ese usuario no existe. ¿Ya lo creaste en Firebase Authentication?",
                "auth/invalid-email": "El usuario no es válido.",
                "auth/operation-not-allowed": "Falta habilitar 'Email/Password' en Firebase Authentication.",
                "auth/too-many-requests": "Demasiados intentos. Espera un momento e inténtalo de nuevo."
            };
            err.textContent = map[ex.code] || ("Error: " + ex.message);
        } finally {
            btn.disabled = false; btn.textContent = "Entrar";
        }
    });

    $("logout-btn").addEventListener("click", () => {
        if (dirty && !confirm("Tienes cambios de texto sin guardar. ¿Salir de todos modos?")) return;
        signOut(auth);
    });

    $("save-btn").addEventListener("click", save);

    window.addEventListener("beforeunload", (e) => {
        if (dirty) { e.preventDefault(); e.returnValue = ""; }
    });

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            $("login").classList.add("hidden");
            $("app").classList.remove("hidden");
            try { await loadData(); }
            catch (e) { setStatus("Error al cargar: " + e.message, true); }
        } else {
            $("app").classList.add("hidden");
            $("login").classList.remove("hidden");
            $("password").value = "";
        }
    });
</script>
</body>
</html>
